<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /* うにとまき デザインシステム v1.0 — src/app/globals.css の値をそのまま使う */
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@600&display=swap");

    :root {
      --paper: oklch(0.985 0.005 85);
      --card: oklch(0.997 0.002 85);
      --well: oklch(0.965 0.008 85);
      --hover: oklch(0.955 0.01 85);
      --line: oklch(0.9 0.012 85);
      --line-strong: oklch(0.64 0.015 80);
      --ink: oklch(0.27 0.012 60);
      --ink-strong: oklch(0.19 0.015 60);
      --ink-muted: oklch(0.47 0.015 60);
      --ink-subtle: oklch(0.6 0.012 60);
      --accent: oklch(0.56 0.15 50);
      --accent-hover: oklch(0.5 0.15 48);
      --on-accent: #ffffff;
      --accent-soft: oklch(0.95 0.035 75);
      --on-accent-soft: oklch(0.42 0.13 48);
      --link: oklch(0.48 0.14 48);
      --link-hover: oklch(0.42 0.14 46);
      --secondary: oklch(0.38 0.05 165);
      --on-secondary: #ffffff;
      --secondary-soft: oklch(0.94 0.025 165);
      --on-secondary-soft: oklch(0.34 0.06 165);
      --shadow-sm: 0 1px 2px oklch(0.19 0.015 60 / 0.06);

      --gutter: clamp(1rem, 4vw, 2rem);
      --block: clamp(1.5rem, 3vw, 2.5rem);
      --section: clamp(4rem, 6vw + 1rem, 7rem);
      --radius-xs: 0.125rem;
      --radius-sm: 0.375rem;
      --radius-md: 0.625rem;
      --radius-full: 9999px;

      --font-sans: "Noto Sans JP", "Inter", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      --font-serif: "Fraunces", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    }

    :root:has([data-theme="dark"]) {
      --paper: oklch(0.21 0.009 60);
      --card: oklch(0.25 0.01 60);
      --well: oklch(0.18 0.008 60);
      --hover: oklch(0.29 0.011 60);
      --line: oklch(0.33 0.011 60);
      --line-strong: oklch(0.55 0.012 60);
      --ink: oklch(0.9 0.012 80);
      --ink-strong: oklch(0.96 0.008 80);
      --ink-muted: oklch(0.71 0.014 80);
      --ink-subtle: oklch(0.6 0.012 80);
      --accent: oklch(0.78 0.14 68);
      --accent-hover: oklch(0.83 0.13 72);
      --on-accent: oklch(0.2 0.03 60);
      --accent-soft: oklch(0.3 0.05 60);
      --on-accent-soft: oklch(0.86 0.11 72);
      --link: oklch(0.8 0.12 70);
      --link-hover: oklch(0.86 0.11 74);
      --secondary: oklch(0.72 0.07 165);
      --on-secondary: oklch(0.18 0.03 165);
      --secondary-soft: oklch(0.28 0.04 165);
      --on-secondary-soft: oklch(0.83 0.08 165);
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
    }

    /* Tailwind preflight と同じ box-sizing */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      letter-spacing: 0.02em;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); }

    h1, h2, h3, h4, p, ol, ul, dl, dd, figure, blockquote { margin: 0; }
    ol, ul { list-style: none; padding: 0; }

    /* 見出しのみ palt。本文には使わない（v1.0 §3.2） */
    h1, h2, .display, .card-title { font-feature-settings: "palt" 1; text-wrap: balance; word-break: auto-phrase; }
    p { text-wrap: pretty; }
    time, .price { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100%; background: var(--paper);">
  <header style="position: sticky; top: 0; z-index: 40; border-bottom: 1px solid transparent; background: color-mix(in oklch, var(--paper) 88%, transparent); backdrop-filter: blur(12px);">
    <div style="display: flex; height: 56px; align-items: center; gap: 12px; padding: 0 var(--gutter);">
      <a href="#" style="display: flex; align-items: baseline; gap: 10px; white-space: nowrap;">
        <span style="font-family: var(--font-serif); font-size: 20px; font-weight: 600; color: var(--ink-strong);">うに＆まき</span>
      </a>
      <div style="display: flex; align-items: center; gap: 4px; margin-left: auto;">
        <span style="display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--ink-muted);"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg></span>
        <button type="button" aria-label="メニューを開く" style="display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; background: none; border-radius: var(--radius-full); color: var(--ink); cursor: pointer;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="9" x2="20" y2="9"></line><line x1="4" y1="15" x2="20" y2="15"></line></svg></button>
      </div>
    </div>
  </header>

  <section style="border-bottom: 1px solid var(--line);">
    <!-- 写真は 34svh に抑える。2本目の CTA を最初の画面に収めるため -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow: hidden; height: 287px; padding: 0 16px; text-align: center; background: var(--well); box-shadow: inset 0 0 0 1px var(--line);">
      <span style="font-family: var(--font-serif); font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted);">Photo</span>
      <span style="max-width: 24ch; font-size: 0.75rem; line-height: 1.6; letter-spacing: 0.03em; color: var(--ink-muted);">撮影予定：うにとまきが同じフレームに入った1枚（自然光・河川敷）</span>
    </div>
    <p style="padding: 8px var(--gutter); font-size: 0.75rem; line-height: 1.6; letter-spacing: 0.03em; color: var(--ink-muted);">2026年8月、近所の河川敷にて</p>

    <div style="padding: 16px var(--gutter) 40px;">
      <p style="font-family: var(--font-serif); font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted);">Uni &amp; Maki — A Dog Journal</p>
      <h1 style="margin-top: 16px; font-family: var(--font-serif); font-weight: 600; font-size: clamp(2.25rem, 1.6rem + 2.8vw, 3.75rem); line-height: 1.25; letter-spacing: 0.03em; color: var(--ink-strong);">うにと、まきと、暮らす。</h1>
      <p style="margin-top: 16px; max-width: 34ch; font-size: 1.125rem; line-height: 1.9; letter-spacing: 0.02em; color: var(--ink);">ミックスのうにと、ミックスのまき。2匹とのふつうの毎日、飼い主目線の本音レビュー、そしてこれから犬を迎える人のための準備ガイド。</p>

      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
        <a href="#" style="display: inline-flex; height: 52px; width: 100%; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-sm); padding: 0 28px; font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; background: var(--accent); color: var(--on-accent);">最新の記事を読む</a>
        <a href="#" style="display: inline-flex; height: 52px; width: 100%; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); padding: 0 28px; font-size: 1rem; font-weight: 600; letter-spacing: 0.02em; color: var(--ink);">はじめて犬を迎える方へ</a>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 24px;">
        <span style="font-size: 0.75rem; line-height: 1.6; letter-spacing: 0.03em; color: var(--ink-muted);">毎日の写真は</span>
        <ul style="display: flex; align-items: center; gap: 4px;">
          <li><a href="#" aria-label="Instagram" style="display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--ink-muted);"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.3-1.46.72-2.13 1.38C1.35 2.68.93 3.35.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.3.79.72 1.46 1.38 2.13.67.66 1.34 1.08 2.13 1.38.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.3 1.46-.72 2.13-1.38.66-.67 1.08-1.34 1.38-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91-.3-.79-.72-1.46-1.38-2.13C21.32 1.35 20.65.93 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0z"></path><path d="M12 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"></path><circle cx="18.41" cy="5.59" r="1.44"></circle></svg></a></li>
          <li><a href="#" aria-label="X" style="display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--ink-muted);"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.46l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41z"></path></svg></a></li>
          <li><a href="#" aria-label="TikTok" style="display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: var(--radius-full); color: var(--ink-muted);"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3 0 .59.05.86.13V9.4a6.34 6.34 0 0 0-1-.05A6.33 6.33 0 0 0 5.24 20.9a6.33 6.33 0 0 0 10.1-5.06V8.83a8.16 8.16 0 0 0 4.77 1.52V6.9a4.85 4.85 0 0 1-.52-.21z"></path></svg></a></li>
        </ul>
        <span style="font-size: 0.75rem; line-height: 1.6; letter-spacing: 0.03em; color: var(--ink-muted);">で</span>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"テーマ"},"$preview":{"width":390,"height":930}}'>

  renderVals() {
    return { theme: this.props.dark ? "dark" : "light" };
  }
}
</script>
